name: Refresh profile card

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - profile.config.json
      - package.json
      - package-lock.json
      - scripts/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: refresh-profile-card-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: cache/loc-private.json
          key: loc-private-${{ github.run_id }}
          restore-keys: |
            loc-private-

      - run: npm ci

      - run: npm test

      # Repository secret STATS_TOKEN (read:user) is already configured.
      # It is used when present, including the run on main after this workflow
      # is merged. An empty secret falls back to GITHUB_TOKEN and public data.
      # Private repositories are included only when the token can see them.
      - name: Generate profile assets
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate.mjs

      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets cache/loc.json
          if git diff --staged --quiet; then
            echo "No profile changes to commit."
          else
            git commit -m "chore: refresh profile card"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
